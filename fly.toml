# Fly.io alternative. First: fly launch --no-deploy ; fly volumes create vendorflow_data --size 1
# Then: fly secrets set SESSION_SECRET=$(openssl rand -hex 32) APP_URL=https://<app>.fly.dev ; fly deploy
app = "vendorflow"
primary_region = "bom"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"
  DEMO_MODE = "true"

[mounts]
  source = "vendorflow_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
